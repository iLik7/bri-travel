# Pengaturan Pages CMS (app.pagescms.org): form untuk edit isi website tanpa ngoding.
media:
  input: images
  output: /images
content:
  - name: artikel
    label: Artikel
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [ title, date ]
    fields:
      - { name: layout, label: Layout, type: string, hidden: true, default: artikel }
      - { name: title, label: Judul artikel, type: string, required: true }
      - { name: date, label: Tanggal, type: date }
      - { name: ringkasan, label: Ringkasan singkat (tampil di daftar artikel), type: text }
      - { name: judul, label: Judul untuk Google (opsional), type: string }
      - { name: deskripsi, label: Deskripsi untuk Google (opsional), type: text }
      - { name: gambar, label: Gambar sampul, type: image }
      - { name: body, label: Isi artikel, type: rich-text }
  - name: promo
    label: Promo Bulan Ini
    type: file
    path: _data/promo.yml
    fields:
      - { name: judul_halaman, label: Judul halaman promo, type: string }
      - { name: keterangan, label: Kalimat pembuka, type: text }
      - name: daftar
        label: Daftar promo
        type: object
        list: true
        fields:
          - { name: nama, label: Nama promo (contoh Umroh Ramadhan), type: string, required: true }
          - { name: tagline, label: Tagline, type: string }
          - { name: poster, label: Poster promo (upload dari Canva sebagai JPG), type: image }
          - { name: tampil, label: Tampilkan di website, type: boolean, default: true }
          - { name: termasuk, label: Harga sudah termasuk, type: string, list: true }
          - name: jadwal
            label: Jadwal keberangkatan
            type: object
            list: true
            fields:
              - { name: tanggal, label: Tanggal berangkat, type: string }
              - { name: durasi, label: Durasi (contoh 12 Hari), type: string }
              - { name: maskapai, label: Maskapai, type: string }
              - { name: rute, label: Rute, type: string }
              - { name: hotel_makkah, label: Hotel Makkah, type: string }
              - { name: hotel_madinah, label: Hotel Madinah, type: string }
              - { name: harga, label: Harga (contoh Rp 39 juta), type: string }
              - { name: bonus, label: Bonus (opsional, contoh Free kereta cepat), type: string }
  - name: info
    label: Izin, Cara Daftar & FAQ
    type: file
    path: _data/info.yml
    fields:
      - name: izin
        label: Badge izin resmi
        type: object
        fields:
          - { name: judul, label: Judul, type: string }
          - { name: teks, label: Keterangan, type: string }
          - { name: link_cek, label: Link badge (default /legalitas/), type: string }
          - { name: label_cek, label: Tulisan link cek izin, type: string }
      - { name: keunggulan, label: Keunggulan (baris centang di bawah foto atas), type: string, list: true }
      - name: langkah
        label: Langkah pendaftaran
        type: object
        list: true
        fields:
          - { name: judul, label: Judul langkah, type: string }
          - { name: teks, label: Penjelasan, type: text }
      - { name: dokumen, label: Dokumen yang perlu disiapkan, type: string, list: true }
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - { name: tanya, label: Pertanyaan, type: string }
          - { name: jawab, label: Jawaban, type: text }
  - name: legalitas
    label: Halaman Legalitas
    type: file
    path: _data/legalitas.yml
    fields:
      - { name: judul, label: Judul halaman, type: string }
      - { name: keterangan, label: Keterangan, type: text }
      - name: izin
        label: Daftar izin (kosongkan nomor kalau belum ada, nanti tidak tampil)
        type: object
        list: true
        fields:
          - { name: nama, label: Nama izin, type: string }
          - { name: nomor, label: Nomor, type: string }
          - { name: keterangan, label: Keterangan, type: string }
      - { name: cek_judul, label: Judul cara cek, type: string }
      - { name: cek_langkah, label: Langkah cek izin, type: string, list: true }
      - { name: cek_link, label: Link aplikasi cek izin, type: string }
      - { name: cek_tombol, label: Tulisan tombol cek, type: string }
      - { name: rekening_judul, label: Judul rekening, type: string }
      - { name: rekening_keterangan, label: Keterangan rekening, type: text }
      - name: rekening
        label: Rekening resmi (kosong = bagian tidak tampil)
        type: object
        list: true
        fields:
          - { name: bank, label: Bank, type: string }
          - { name: nomor, label: Nomor rekening, type: string }
          - { name: atas_nama, label: Atas nama, type: string }
      - { name: waspada_judul, label: Judul peringatan, type: string }
      - { name: waspada, label: Poin peringatan penipuan, type: string, list: true }
  - name: keberangkatan
    label: Keberangkatan Terakhir
    type: file
    path: _data/keberangkatan.yml
    fields:
      - { name: judul, label: Judul bagian, type: string }
      - { name: keterangan, label: Kalimat pembuka, type: text }
      - name: rombongan
        label: Rombongan (yang paling baru taruh paling atas)
        type: object
        list: true
        fields:
          - { name: nama, label: Nama rombongan (contoh Rombongan Umroh Januari 2027), type: string, required: true }
          - { name: tanggal, label: Bulan / tanggal berangkat, type: string }
          - { name: paket, label: Paket (contoh Paket 12 Hari), type: string }
          - { name: jumlah_jamaah, label: Jumlah jamaah (opsional), type: string }
          - { name: tampil, label: Tampilkan di website, type: boolean, default: true }
          - name: video
            label: Video (MP4 vertikal, di bawah 10 MB per video)
            type: object
            list: true
            fields:
              - { name: file, label: File video (MP4), type: file, options: { extensions: [mp4] } }
              - { name: sampul, label: Gambar sampul, type: image }
              - { name: keterangan, label: Keterangan singkat, type: string }
  - name: pameran
    label: Upcoming Pameran
    type: file
    path: _data/pameran.yml
    list: true
    fields:
      - { name: nama, label: Nama pameran, type: string, required: true }
      - { name: tanggal, label: Tanggal, type: string }
      - { name: lokasi, label: Lokasi, type: string }
      - { name: stand, label: Nomor / posisi stand kita, type: string }
      - { name: keterangan, label: Keterangan singkat, type: text }
      - { name: gambar, label: Gambar / denah pameran, type: image }
      - { name: link_maps, label: Link Google Maps lokasi (opsional), type: string }
      - { name: tampil, label: Tampilkan di website (matikan kalau pameran sudah lewat), type: boolean, default: true }
  - name: testimoni
    label: Testimoni Jamaah
    type: file
    path: _data/testimoni.yml
    list: true
    fields:
      - name: nama
        label: Nama jamaah
        type: string
        required: true
      - name: paket
        label: Keterangan (contoh "Jamaah Umroh 13 hari")
        type: string
      - name: foto
        label: Foto (juga jadi sampul video)
        type: image
      - name: video
        label: Video testimoni (MP4, opsional, di bawah 10 MB)
        type: file
        options: { extensions: [mp4] }
      - name: kutipan
        label: Kutipan testimoni (opsional)
        type: text
  - name: tim
    label: Ustadz & Tim
    type: file
    path: _data/tim.yml
    fields:
      - name: ustadz
        label: Ustadz pembimbing
        type: object
        fields:
          - { name: nama, label: Nama, type: string }
          - { name: foto, label: Foto, type: image }
      - name: anggota
        label: Anggota tim
        type: object
        list: true
        fields:
          - { name: nama, label: Nama, type: string }
          - { name: jabatan, label: Jabatan, type: string }
          - { name: foto, label: Foto, type: image }
  - name: umum
    label: Info Umum, Kontak & Foto Utama
    type: file
    path: _data/umum.yml
    fields:
      - { name: judul_hero, label: Judul besar di atas, type: string }
      - { name: subjudul_hero, label: Kalimat di bawah judul, type: text }
      - name: video_hero
        label: Video atas (maks 3, yang ke-2 tampil di HP). Video MP4 di bawah 5 MB.
        type: object
        list: { min: 1, max: 3 }
        fields:
          - { name: video, label: Video (MP4), type: file, options: { extensions: [mp4] } }
          - { name: poster, label: Gambar sampul (tampil sebelum video jalan), type: image }
      - { name: jumlah_jamaah, label: Jumlah jamaah (contoh "1000+"), type: string }
      - { name: lama_tahun, label: Lama berdiri (tahun), type: string }
      - { name: video_tentang, label: Video bagian Tentang Kami (MP4), type: file, options: { extensions: [mp4] } }
      - { name: poster_tentang, label: Gambar sampul video Tentang Kami, type: image }
      - { name: foto_daftar, label: Foto bagian Segera Daftar, type: image }
      - { name: wa_cs, label: "WA Customer Service (format 62..., tanpa + dan spasi)", type: string }
      - { name: wa_cs_tampil, label: Nomor CS yang ditampilkan, type: string }
      - { name: wa_konsultan, label: "WA Umroh Consultant (format 62...)", type: string }
      - { name: wa_konsultan_tampil, label: Nomor konsultan yang ditampilkan, type: string }
      - { name: izin_ppiu, label: Nomor izin PPIU, type: string }
      - { name: email, label: Email, type: string }
      - { name: jam_kerja, label: Jam kerja, type: string }
      - { name: jam_libur, label: Keterangan akhir pekan, type: string }
      - { name: alamat, label: Alamat kantor, type: string }
      - { name: link_maps, label: Link Google Maps, type: string }
      - { name: peta_embed, label: Link peta (embed Google Maps), type: string }
      - { name: link_review, label: Link tulis ulasan Google, type: string }
      - { name: instagram, label: Link Instagram (opsional), type: string }
      - { name: facebook, label: Link Facebook (opsional), type: string }
      - { name: tiktok, label: Link TikTok (opsional), type: string }
      - { name: youtube, label: Link YouTube (opsional), type: string }
