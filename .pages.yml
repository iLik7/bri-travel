# Pengaturan Pages CMS (app.pagescms.org): form untuk edit isi website tanpa ngoding.
media:
  input: images
  output: /images
content:
  - name: promo
    label: Promo Bulan Ini
    type: file
    path: _data/promo.yml
    fields:
      - { name: judul_halaman, label: Judul halaman promo, type: string }
      - { name: keterangan, label: Kalimat pembuka, type: text }
      - name: daftar
        label: Daftar promo
        type: object
        list: true
        fields:
          - { name: nama, label: Nama promo (contoh Umroh Ramadhan), type: string, required: true }
          - { name: tagline, label: Tagline, type: string }
          - { name: poster, label: Poster promo (upload dari Canva sebagai JPG), type: image }
          - { name: tampil, label: Tampilkan di website, type: boolean, default: true }
          - { name: termasuk, label: Harga sudah termasuk, type: string, list: true }
          - name: jadwal
            label: Jadwal keberangkatan
            type: object
            list: true
            fields:
              - { name: tanggal, label: Tanggal berangkat, type: string }
              - { name: durasi, label: Durasi (contoh 12 Hari), type: string }
              - { name: maskapai, label: Maskapai, type: string }
              - { name: rute, label: Rute, type: string }
              - { name: hotel_makkah, label: Hotel Makkah, type: string }
              - { name: hotel_madinah, label: Hotel Madinah, type: string }
              - { name: harga, label: Harga (contoh Rp 39 juta), type: string }
              - { name: bonus, label: Bonus (opsional, contoh Free kereta cepat), type: string }
  - name: pameran
    label: Upcoming Pameran
    type: file
    path: _data/pameran.yml
    list: true
    fields:
      - { name: nama, label: Nama pameran, type: string, required: true }
      - { name: tanggal, label: Tanggal, type: string }
      - { name: lokasi, label: Lokasi, type: string }
      - { name: stand, label: Nomor / posisi stand kita, type: string }
      - { name: keterangan, label: Keterangan singkat, type: text }
      - { name: gambar, label: Gambar / denah pameran, type: image }
      - { name: link_maps, label: Link Google Maps lokasi (opsional), type: string }
      - { name: tampil, label: Tampilkan di website (matikan kalau pameran sudah lewat), type: boolean, default: true }
  - name: paket
    label: Paket Umroh
    type: file
    path: _data/paket.yml
    list: true
    fields:
      - name: nama
        label: Nama paket
        type: string
        required: true
      - name: label
        label: Label kecil (contoh Reguler, Premium, Promo)
        type: string
      - name: foto
        label: Foto (kosongkan untuk kartu tanpa foto)
        type: image
      - name: harga
        label: Harga (opsional, contoh "Mulai Rp 32 juta")
        type: string
      - name: keberangkatan
        label: Tanggal keberangkatan (opsional)
        type: string
      - name: fasilitas
        label: Fasilitas
        type: string
        list: true
      - name: tampil
        label: Tampilkan di website
        type: boolean
        default: true
  - name: testimoni
    label: Testimoni Jamaah
    type: file
    path: _data/testimoni.yml
    list: true
    fields:
      - name: nama
        label: Nama jamaah
        type: string
        required: true
      - name: paket
        label: Keterangan (contoh "Jamaah Umroh 13 hari")
        type: string
      - name: foto
        label: Foto
        type: image
      - name: kutipan
        label: Kutipan testimoni (opsional)
        type: text
  - name: tim
    label: Ustadz & Tim
    type: file
    path: _data/tim.yml
    fields:
      - name: ustadz
        label: Ustadz pembimbing
        type: object
        fields:
          - { name: nama, label: Nama, type: string }
          - { name: foto, label: Foto, type: image }
      - name: anggota
        label: Anggota tim
        type: object
        list: true
        fields:
          - { name: nama, label: Nama, type: string }
          - { name: jabatan, label: Jabatan, type: string }
          - { name: foto, label: Foto, type: image }
  - name: umum
    label: Info Umum, Kontak & Foto Utama
    type: file
    path: _data/umum.yml
    fields:
      - { name: judul_hero, label: Judul besar di atas, type: string }
      - { name: subjudul_hero, label: Kalimat di bawah judul, type: text }
      - name: video_hero
        label: Video atas (maks 3, yang ke-2 tampil di HP). Video MP4 di bawah 5 MB.
        type: object
        list: { min: 1, max: 3 }
        fields:
          - { name: video, label: Video (MP4), type: file, options: { extensions: [mp4] } }
          - { name: poster, label: Gambar sampul (tampil sebelum video jalan), type: image }
      - { name: jumlah_jamaah, label: Jumlah jamaah (contoh "1000+"), type: string }
      - { name: lama_tahun, label: Lama berdiri (tahun), type: string }
      - { name: video_tentang, label: Video bagian Tentang Kami (MP4), type: file, options: { extensions: [mp4] } }
      - { name: poster_tentang, label: Gambar sampul video Tentang Kami, type: image }
      - { name: foto_daftar, label: Foto bagian Segera Daftar, type: image }
      - { name: wa_cs, label: "WA Customer Service (format 62..., tanpa + dan spasi)", type: string }
      - { name: wa_cs_tampil, label: Nomor CS yang ditampilkan, type: string }
      - { name: wa_konsultan, label: "WA Umroh Consultant (format 62...)", type: string }
      - { name: wa_konsultan_tampil, label: Nomor konsultan yang ditampilkan, type: string }
      - { name: izin_ppiu, label: Nomor izin PPIU, type: string }
      - { name: email, label: Email, type: string }
      - { name: jam_kerja, label: Jam kerja, type: string }
      - { name: jam_libur, label: Keterangan akhir pekan, type: string }
      - { name: alamat, label: Alamat kantor, type: string }
      - { name: link_maps, label: Link Google Maps, type: string }
      - { name: instagram, label: Link Instagram (opsional), type: string }
      - { name: facebook, label: Link Facebook (opsional), type: string }
      - { name: tiktok, label: Link TikTok (opsional), type: string }
      - { name: youtube, label: Link YouTube (opsional), type: string }
