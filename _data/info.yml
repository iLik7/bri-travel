izin:
  judul: Izin Resmi Kemenag RI
  teks: Penyelenggara Perjalanan Ibadah Umrah (PPIU) terdaftar
  link_cek: /legalitas/
  label_cek: Lihat legalitas & cara cek
keunggulan:
  - Penerbangan langsung tanpa transit
  - Hotel dekat Masjid ± 150 m
  - Dibimbing ustadz & muthowif
  - Katering menu Indonesia
langkah:
  - judul: Konsultasi gratis
    teks: Chat WhatsApp kami, ceritakan rencana dan budget. Tim kami bantu pilihkan paket dan jadwal yang pas.
  - judul: Bayar DP Rp 5 juta
    teks: Amankan kursi Anda dengan uang muka Rp 5 juta. Bukti pembayaran resmi kami kirimkan.
  - judul: Lengkapi dokumen
    teks: Serahkan dokumen persyaratan. Pengurusan visa dan tiket kami yang uruskan.
  - judul: Manasik & berangkat
    teks: Ikuti manasik bersama ustadz pembimbing, terima perlengkapan, lalu berangkat ke Tanah Suci.
dokumen:
  - Paspor (masih berlaku minimal 7 bulan saat berangkat)
  - Fotokopi KTP
  - Fotokopi Kartu Keluarga
  - Fotokopi buku nikah (untuk pasangan suami istri)
  - Fotokopi akta kelahiran (untuk anak)
  - Pas foto 4x6 latar putih, tampak wajah 80%
  - Kartu vaksin meningitis (ICV)
faq:
  - tanya: Berapa DP untuk daftar Umroh?
    jawab: DP pendaftaran Rp 5 juta per jamaah untuk mengamankan kursi. Sisa pembayaran dilunasi sebelum keberangkatan, jadwal pelunasan kami informasikan saat pendaftaran.
  - tanya: Harga paket sudah termasuk apa saja?
    jawab: Umumnya sudah termasuk tiket pesawat PP, visa Umroh, hotel, makan 3x sehari, transportasi, muthowif, perlengkapan, air zamzam, dan asuransi. Rincian tiap paket ada di bagian Promo Bulan Ini.
  - tanya: Belum punya paspor, bisa tetap daftar?
    jawab: Bisa. Anda tetap bisa daftar dan bayar DP dulu, lalu urus paspor sambil menunggu keberangkatan. Tim kami siap memandu prosesnya.
  - tanya: Apakah ada manasik sebelum berangkat?
    jawab: Ada. Jamaah mengikuti manasik bersama ustadz pembimbing sebelum berangkat, supaya ibadah di Tanah Suci lancar dan tenang.
  - tanya: Bisa daftar untuk orang tua atau lansia?
    jawab: Bisa. Kabarkan kondisi kesehatan jamaah saat mendaftar supaya tim kami bisa menyiapkan pendampingan yang sesuai.
  - tanya: Apakah travel ini resmi?
    jawab: Ya. PT. Barokah Ridho Ilahi memiliki izin resmi PPIU dari Kementerian Agama RI dan sudah memberangkatkan lebih dari 1000 jamaah selama 10 tahun. Izin kami bisa Anda cek sendiri lewat aplikasi resmi Satu Haji dari Kementerian Haji dan Umrah. Buka menu Layanan, pilih Umrah & Haji Khusus, lalu Penyelenggara Umrah (PPIU), dan ketik Barokah Ridho Ilahi.
  - tanya: Di mana kantornya? Bisa datang langsung?
    jawab: Kantor kami di Jl. Pakis Tirtosari No. 9, Surabaya. Buka Senin–Jumat 09.00–16.00, Sabtu–Minggu dengan janji temu lewat WhatsApp.
